<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFC — Panel kodów</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.18);
    --text: #e8e8e8;
    --muted: rgba(255,255,255,0.3);
    --accent: #ffffff;
    --green: #a8f0c6;
    --red: #f08080;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(13,13,13,0.92);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .header-title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    flex: 1;
  }

  .header-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* ── Top controls ── */
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .search-wrap {
    position: relative;
  }
  .search-wrap svg {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }
  .search-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px 9px 36px;
    color: var(--text);
    font-size: 13px;
    width: 200px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--border-hover); }
  .search-input::placeholder { color: var(--muted); }

  .btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 16px;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { border-color: var(--border-hover); background: var(--surface); }
  .btn.primary {
    background: var(--accent);
    color: #000;
    border-color: transparent;
    font-weight: 600;
  }
  .btn.primary:hover { background: rgba(255,255,255,0.85); }
  .btn.danger { color: var(--red); border-color: rgba(240,128,128,0.2); }
  .btn.danger:hover { background: rgba(240,128,128,0.08); }

  /* ── Stats bar ── */
  .stats {
    padding: 14px 28px;
    display: flex;
    gap: 24px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .stat { display: flex; gap: 6px; align-items: center; }
  .stat-num { font-weight: 700; font-size: 14px; }
  .stat-num.filled { color: var(--green); }
  .stat-num.empty { color: var(--muted); }

  /* ── Import modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    width: 100%;
    max-width: 520px;
    animation: modalIn 0.25s cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(12px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal h2 { font-size: 16px; margin-bottom: 8px; }
  .modal p  { font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }

  .import-textarea {
    width: 100%;
    height: 180px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    color: var(--text);
    font-size: 13px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    resize: vertical;
    outline: none;
    line-height: 1.6;
  }
  .import-textarea:focus { border-color: var(--border-hover); }
  .import-textarea::placeholder { color: rgba(255,255,255,0.2); }

  .modal-footer {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    justify-content: flex-end;
  }

  /* ── Grid ── */
  .grid-wrap {
    padding: 24px 28px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }

  /* ── Card slot ── */
  .slot {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: border-color 0.15s, background 0.15s;
  }
  .slot:hover { border-color: var(--border-hover); }
  .slot.has-code { border-color: rgba(168,240,198,0.15); }
  .slot.highlight { border-color: rgba(255,255,255,0.4) !important; background: rgba(255,255,255,0.03); }
  .slot.hidden-slot { display: none; }

  .slot-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .slot-num {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--muted);
  }
  .slot-status {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    transition: background 0.2s;
  }
  .slot.has-code .slot-status { background: var(--green); }

  .slot-input {
    background: var(--bg);
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 9px 11px;
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    letter-spacing: 0.06em;
    width: 100%;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .slot-input:focus {
    border-color: var(--border-hover);
    background: var(--surface2);
  }
  .slot-input::placeholder { color: rgba(255,255,255,0.15); font-weight: 400; letter-spacing: 0; font-family: inherit; }

  .slot-actions {
    display: flex;
    gap: 6px;
  }
  .slot-link {
    flex: 1;
    font-size: 11px;
    color: var(--muted);
    background: var(--surface2);
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 6px 9px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    text-decoration: none;
  }
  .slot-link:hover { color: var(--text); border-color: var(--border); }

  .slot-copy-link {
    font-size: 11px;
    color: var(--muted);
    background: var(--surface2);
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 6px 9px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .slot-copy-link:hover { color: var(--text); border-color: var(--border); }
  .slot-copy-link.ok { color: var(--green); }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 12px 22px;
    font-size: 13px;
    color: var(--text);
    z-index: 500;
    transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
    white-space: nowrap;
    pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* ── Empty state ── */
  .empty-state {
    display: none;
    grid-column: 1/-1;
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <div style="flex:1">
    <div class="header-title">Panel kodów NFC</div>
    <div class="header-sub">Zarządzaj kodami dla 100 kart</div>
  </div>
  <div class="controls">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input class="search-input" type="text" id="searchInput" placeholder="Szukaj kodu lub #nr…" oninput="filterSlots()">
    </div>
    <button class="btn" onclick="openImport()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      Importuj listę
    </button>
    <button class="btn" onclick="exportCodes()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Eksportuj
    </button>
    <button class="btn primary" onclick="saveAll()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
      </svg>
      Zapisz wszystko
    </button>
    <button class="btn danger" onclick="clearAll()">Wyczyść</button>
  </div>
</header>

<div class="stats">
  <div class="stat">
    <span class="stat-num filled" id="statFilled">0</span>
    <span style="color:var(--muted)">wypełnionych</span>
  </div>
  <div class="stat">
    <span class="stat-num empty" id="statEmpty">100</span>
    <span style="color:var(--muted)">pustych</span>
  </div>
  <div class="stat">
    <span style="color:var(--muted)">URL do NFC:</span>
    <span id="baseUrlDisplay" style="font-size:11px;color:rgba(255,255,255,0.45);font-family:monospace"></span>
  </div>
</div>

<div class="grid-wrap">
  <div class="grid" id="grid">
    <div class="empty-state" id="emptyState">Brak wyników wyszukiwania</div>
  </div>
</div>

<!-- Import modal -->
<div class="modal-overlay" id="importModal">
  <div class="modal">
    <h2>Importuj kody</h2>
    <p>Wklej kody — jeden na linię. Zostaną przypisane kolejno do kart 1, 2, 3… Puste linie są pomijane.</p>
    <textarea class="import-textarea" id="importText" placeholder="KOD001&#10;KOD002&#10;KOD003&#10;…"></textarea>
    <div class="modal-footer">
      <button class="btn" onclick="closeImport()">Anuluj</button>
      <button class="btn primary" onclick="doImport()">Importuj</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  const BASE_URL = window.location.origin + window.location.pathname.replace('nfc-admin.html', 'nfc-scan.html');
  const STORAGE_KEY = 'nfc_codes';

  document.getElementById('baseUrlDisplay').textContent = BASE_URL + '?id=';

  // ── State ──
  let codes = load();

  function load() {
    try {
      const s = localStorage.getItem(STORAGE_KEY);
      const obj = s ? JSON.parse(s) : {};
      const result = {};
      for (let i = 1; i <= 100; i++) result[i] = obj[i] || '';
      return result;
    } catch {
      const r = {};
      for (let i = 1; i <= 100; i++) r[i] = '';
      return r;
    }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(codes));
    updateStats();
  }

  function saveAll() {
    collectInputs();
    save();
    toast('Zapisano wszystkie kody ✓');
  }

  function collectInputs() {
    document.querySelectorAll('.slot-input').forEach(inp => {
      const id = parseInt(inp.dataset.id);
      codes[id] = inp.value.trim();
      const slot = inp.closest('.slot');
      slot.classList.toggle('has-code', !!codes[id]);
    });
  }

  function clearAll() {
    if (!confirm('Wyczyścić wszystkie 100 kodów?')) return;
    for (let i = 1; i <= 100; i++) codes[i] = '';
    save();
    document.querySelectorAll('.slot-input').forEach(inp => {
      inp.value = '';
      inp.closest('.slot').classList.remove('has-code');
    });
    toast('Wyczyszczono');
  }

  // ── Render grid ──
  function buildGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '<div class="empty-state" id="emptyState">Brak wyników wyszukiwania</div>';

    for (let i = 1; i <= 100; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot' + (codes[i] ? ' has-code' : '');
      slot.id = `slot-${i}`;
      slot.innerHTML = `
        <div class="slot-header">
          <span class="slot-num">KARTA #${String(i).padStart(3,'0')}</span>
          <span class="slot-status"></span>
        </div>
        <input
          class="slot-input"
          type="text"
          data-id="${i}"
          value="${escHtml(codes[i])}"
          placeholder="Wpisz kod…"
          oninput="onInput(this)"
          onblur="onBlur(this)"
        >
        <div class="slot-actions">
          <a class="slot-link" href="${BASE_URL}?id=${i}" target="_blank">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
            </svg>
            Podgląd
          </a>
          <button class="slot-copy-link" onclick="copyLink(${i}, this)">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            Kopiuj URL
          </button>
        </div>`;
      grid.appendChild(slot);
    }
    updateStats();
  }

  function escHtml(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function onInput(inp) {
    const id = parseInt(inp.dataset.id);
    codes[id] = inp.value.trim();
    inp.closest('.slot').classList.toggle('has-code', !!codes[id]);
    updateStats();
  }

  function onBlur(inp) {
    const id = parseInt(inp.dataset.id);
    codes[id] = inp.value.trim();
    save();
  }

  function updateStats() {
    let filled = 0;
    for (let i = 1; i <= 100; i++) if (codes[i]) filled++;
    document.getElementById('statFilled').textContent = filled;
    document.getElementById('statEmpty').textContent = 100 - filled;
  }

  // ── Search ──
  function filterSlots() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    let visible = 0;
    for (let i = 1; i <= 100; i++) {
      const slot = document.getElementById(`slot-${i}`);
      if (!slot) continue;
      const matchNum = String(i).includes(q) || `#${String(i).padStart(3,'0')}`.includes(q);
      const matchCode = codes[i].toLowerCase().includes(q);
      const show = !q || matchNum || matchCode;
      slot.classList.toggle('hidden-slot', !show);
      if (show) visible++;
    }
    document.getElementById('emptyState').style.display = visible === 0 ? 'block' : 'none';
  }

  // ── Copy link ──
  function copyLink(id, btn) {
    const url = `${BASE_URL}?id=${id}`;
    navigator.clipboard.writeText(url).then(() => {
      btn.classList.add('ok');
      const orig = btn.innerHTML;
      btn.innerHTML = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Skopiowano`;
      setTimeout(() => { btn.classList.remove('ok'); btn.innerHTML = orig; }, 1800);
    });
  }

  // ── Import ──
  function openImport() {
    document.getElementById('importModal').classList.add('open');
    document.getElementById('importText').focus();
  }
  function closeImport() {
    document.getElementById('importModal').classList.remove('open');
  }
  function doImport() {
    const lines = document.getElementById('importText').value
      .split('\n')
      .map(l => l.trim())
      .filter(l => l.length > 0);
    let idx = 1;
    for (const line of lines) {
      if (idx > 100) break;
      codes[idx] = line;
      const inp = document.querySelector(`.slot-input[data-id="${idx}"]`);
      if (inp) {
        inp.value = line;
        inp.closest('.slot').classList.add('has-code');
      }
      idx++;
    }
    save();
    closeImport();
    document.getElementById('importText').value = '';
    toast(`Zaimportowano ${lines.length > 100 ? 100 : lines.length} kodów ✓`);
  }

  // ── Export ──
  function exportCodes() {
    collectInputs();
    const lines = [];
    for (let i = 1; i <= 100; i++) {
      lines.push(`${String(i).padStart(3,'0')}\t${codes[i] || ''}`);
    }
    const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'nfc-kody.txt';
    a.click();
  }

  // ── Toast ──
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
  }

  // ── Close modal on outside click ──
  document.getElementById('importModal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeImport();
  });

  // ── Keyboard shortcut: Cmd/Ctrl+S = save ──
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 's') {
      e.preventDefault();
      saveAll();
    }
  });

  // ── Boot ──
  buildGrid();
</script>
</body>
</html>
